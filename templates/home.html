<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  </head>
  <body>

    <form action="/" method="GET">
      <input type="text" name="search" placeholder="Search by title..." value="{{ search }}">
      <button type="submit">Search</button>
    </form>

    <p>Sort by: <a href="/?sort=title{% if search %}&search={{ search }}{% endif %}">Title</a> |
       <a href="/?sort=author{% if search %}&search={{ search }}{% endif %}">Author</a></p>

    {% if search and not books %}
      <p>No books match your search criteria.</p>
    {% endif %}

    {% for book in books %}
    <div>
      <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg" alt="Book cover" width="100">
      <h3>{{ book.title }}</h3>
      <p>Author: {{ book.author.name }}</p>
    </div>
    <hr>
    {% endfor %}

  </body>
</html>
