<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  </head>
  <body>

    <p>Sort by: <a href="/?sort=title">Title</a> | <a href="/?sort=author">Author</a></p>

    {% for book in books %}
    <div>
      <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg" alt="Book cover" width="100">
      <h3>{{ book.title }}</h3>
      <p>Author: {{ book.author.name }}</p>
    </div>
    <hr>
    {% endfor %}

  </body>
</html>
